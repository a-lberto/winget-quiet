# Save as .github/workflows/build-winget-quiet.yml in your own repo.
# Builds microsoft/winget-cli with the "licensed to you by its owner" notice removed.
name: Build quiet winget

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "winget-cli tag or branch to build (e.g. v1.9.25200). Empty = latest release tag."
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"   # weekly, rebuild the latest release

permissions:
  contents: write   # needed only for the release step

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Resolve ref
        id: ref
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ref = "${{ inputs.ref }}"
          if (-not $ref) {
            $ref = gh api repos/microsoft/winget-cli/releases/latest --jq .tag_name
          }
          Write-Host "Building $ref"
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout winget-cli
        uses: actions/checkout@v4
        with:
          repository: microsoft/winget-cli
          ref: ${{ steps.ref.outputs.ref }}
          submodules: recursive

      - name: Remove license notice
        shell: pwsh
        run: |
          $path = (Resolve-Path "src/AppInstallerCLICore/Workflows/InstallFlow.cpp").Path
          $hasBom = (([IO.File]::ReadAllBytes($path))[0..2] -join ",") -eq "239,187,191"
          $text = [IO.File]::ReadAllText($path)
          $pattern = '[ \t]*context\.Reporter\.Info\(\)\s*<<\s*Resource::String::InstallationDisclaimer1\s*<<\s*std::endl\s*<<\s*Resource::String::InstallationDisclaimer2\s*<<\s*std::endl;[ \t]*\r?\n'
          $count = [regex]::Matches($text, $pattern).Count
          if ($count -ne 1) { throw "Expected exactly 1 notice statement in $path, found $count (code may have changed)." }
          $new = [regex]::Replace($text, $pattern, "")
          [IO.File]::WriteAllText($path, $new, [Text.UTF8Encoding]::new($hasBom))
          git diff

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The steps below mirror winget-cli's templates/jobs-build.yml.
      - name: Enable vcpkg integration (runner's preinstalled vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integrate install failed" }

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: |
          function Run($exe, $argList) {
            & $exe @argList
            if ($LASTEXITCODE -ne 0) { throw "$exe $argList failed ($LASTEXITCODE)" }
          }
          $cfg = "src/nuget.config"
          # Solution restore covers the native (vcxproj) projects
          Run nuget @("restore", "src/AppInstallerCLI.sln", "-ConfigFile", $cfg)
          # UAP (wapproj) projects are skipped by the solution restore (NuGet/Home#7796)
          Get-ChildItem src -Recurse -Filter *.wapproj | ForEach-Object {
            Run nuget @("restore", $_.FullName, "-ConfigFile", $cfg)
          }
          # .NET projects (IndexCreationTool, LocalhostWebServer, ...)
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            Run dotnet @("restore", $_.FullName, "--configfile", $cfg)
          }

      # MSVC 14.51 (VS 18) makes the deprecated /await header a hard error (STL1011).
      # Put the silencing define straight into every project's compiler options.
      - name: Silence experimental coroutine deprecation (STL1011)
        shell: pwsh
        run: |
          $define = "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $patched = 0
          Get-ChildItem src -Recurse -Filter *.vcxproj | ForEach-Object {
            $path = $_.FullName
            $hasBom = (([IO.File]::ReadAllBytes($path))[0..2] -join ",") -eq "239,187,191"
            $text = [IO.File]::ReadAllText($path)
            if ($text.Contains($define)) { return }
            $new = $text.Replace("<PreprocessorDefinitions>", "<PreprocessorDefinitions>$define;")
            if ($new -ne $text) {
              [IO.File]::WriteAllText($path, $new, [Text.UTF8Encoding]::new($hasBom))
              $patched++
            }
          }
          Write-Host "Patched $patched vcxproj files"
          if ($patched -eq 0) { throw "No PreprocessorDefinitions found to patch." }
          git diff --stat

      - name: Disk space before build
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N="UsedGB";E={[math]::Round($_.Used/1GB,2)}}, @{N="FreeGB";E={[math]::Round($_.Free/1GB,2)}}

      - name: Build solution
        shell: pwsh
        run: |
          # Same MSBuild arguments as upstream's Build Solution step
          msbuild src/AppInstallerCLI.sln /m /bl:msbuild.binlog `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundlePlatforms=x64 `
            /p:AppxPackageDir=$env:RUNNER_TEMP\AppxPackages `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:PreferredToolArchitecture=x64 `
            /p:WingetDisableIncrementalLinkTimeCodeGeneration=true

      - name: Disk space after build
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{N="UsedGB";E={[math]::Round($_.Used/1GB,2)}}, @{N="FreeGB";E={[math]::Round($_.Free/1GB,2)}}

      - name: Upload MSBuild binary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlog
          path: msbuild.binlog
          if-no-files-found: ignore

      - name: Collect output
        shell: pwsh
        run: |
          $exe = Get-ChildItem src -Recurse -Filter winget.exe |
            Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $exe) { throw "winget.exe not found after build." }
          # winget.exe loads WindowsPackageManager.dll, which is built by a separate
          # project into its own output folder.
          $dll = Get-ChildItem src -Recurse -Filter WindowsPackageManager.dll |
            Where-Object { $_.FullName -match "x64\\Release\\WindowsPackageManager\\" } | Select-Object -First 1
          if (-not $dll) { throw "WindowsPackageManager.dll not found after build." }
          Write-Host "winget.exe from: $($exe.FullName)"
          Write-Host "dll from:        $($dll.FullName)"

          # Stage runtime files only: drop debug symbols and linker/compiler leftovers.
          $junk = '.pdb','.lib','.exp','.ilk','.obj','.iobj','.ipdb','.log','.tlog'
          $root = $exe.DirectoryName
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem $root -Recurse -File |
            Where-Object { $junk -notcontains $_.Extension.ToLower() } |
            ForEach-Object {
              $target = Join-Path (Resolve-Path out).Path $_.FullName.Substring($root.Length).TrimStart('\')
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target
            }
          Copy-Item $dll.FullName out
          Get-ChildItem out -Recurse -File | Format-Table FullName, Length
          Compress-Archive -Path out\* -DestinationPath winget-quiet-x64.zip

      - name: Smoke test
        shell: pwsh
        run: |
          & .\out\winget.exe --version
          if ($LASTEXITCODE -ne 0) { throw "winget.exe failed to run ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: winget-quiet-x64
          path: winget-quiet-x64.zip

      - name: Publish release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The working directory is a clone of microsoft/winget-cli, so gh must be told
          # explicitly to use THIS repository instead of the clone's remote.
          $repo = "${{ github.repository }}"
          $tag = "winget-quiet-${{ steps.ref.outputs.ref }}"
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag winget-quiet-x64.zip --clobber --repo $repo }
          else { gh release create $tag winget-quiet-x64.zip --repo $repo --title $tag --notes "winget ${{ steps.ref.outputs.ref }} without the license notice" }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }